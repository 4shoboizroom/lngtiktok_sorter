    <div class="app">
      <header>
        <h1>Bias Sorter</h1>
        <p>Rank your favorites with ease</p>
      </header>

      <!-- Input -->

      <!-- Sorting -->
      <section id="sort-screen" class="screen active">
        <div class="card">
          <div class="sort-header">
            <h2 id="battle-label">Battle #1</h2>
            <p class="progress-text" id="progress-text">0% sorted</p>
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
          </div>

          <p class="hint" style="text-align: center; margin-bottom: 0">
            Which do you prefer?
          </p>

          <div class="comparison">
            <button type="button" class="choice-btn left" id="btn-left"></button>

            <div class="middle-actions">
              <button type="button" class="btn-equal" id="btn-equal">Equal</button>
              <button type="button" class="btn-undo" id="btn-undo" disabled>
                Undo
              </button>
            </div>

            <button type="button" class="choice-btn right" id="btn-right"></button>
          </div>
        </div>
      </section>

      <!-- Results -->
      <section id="results-screen" class="screen">
        <div class="card">
          <div class="sort-header">
            <h2>Your rankings</h2>
            <p class="progress-text">100% sorted</p>
          </div>

          <ol class="results-list" id="results-list"></ol>

          <div class="actions">
            <button type="button" class="btn-secondary" id="copy-btn">
              Copy list
            </button>
            <button type="button" class="btn-secondary" id="save-btn">
              Save to file
            </button>
            <button type="button" class="btn-primary" id="restart-btn">
              Start over
            </button>
          </div>
        </div>
      </section>
    </div>

function parseItems(text) {
  return tiktoks.map((_, index) => index);
}

function getTikTokHTML(index) {
  const item = tiktoks[index];
  if (!item) return "";
  return `<video src="https://google.com{item.id}" controls width="100%"></video><div class="desc">${item.desc}</div>`;
}

      function showError(message) {
  const inputError = document.getElementById("input-error");
  if (inputError) {
    inputError.textContent = message;
    inputError.hidden = !message;
  }
}

function startSorting() {
  showError("");
  const items = parseItems(""); 
  logic = new MergeSortLogic(items);
  battleCount = 0;
  showScreen("sort");
  refreshSortUI();
}


      function handleChoice(choice) {
        if (choice === "undo") {
          if (logic.undo()) {
            battleCount = Math.max(0, battleCount - 1);
            refreshSortUI();
          }
          return;
        }

        logic.recordChoice(choice);
        battleCount++;
        refreshSortUI();
      }

      function refreshSortUI() {
        const pair = logic.getNextPair();

        if (!pair) {
          finalRanking = logic.getFinalRanking();
          showResults(finalRanking);
          return;
        }

          const [left, right] = pair;
  btnLeft.innerHTML = getTikTokHTML(left);
  btnRight.innerHTML = getTikTokHTML(right);

        


        battleLabel.textContent = `Battle #${battleCount + 1}`;
        const progress = logic.getProgress();
        progressText.textContent = `${Math.round(progress)}% sorted`;
        progressFill.style.width = `${progress}%`;
        btnUndo.disabled = !logic.canUndo();
      }

  if (!item) return "";

}
      
      function showResults(ranking) {
         resultsList.innerHTML = ranking
    .map(
      (item, i) =>
        `<li><span class="rank">${i + 1}.</span> ${getTikTokHTML(item)}</li>`
    )
    .join("");

        showScreen("results");
      }

     function escapeHtml(text) {
  return text;
}

      function copyResults() {
        const text = finalRanking
          .map((item, i) => `${i + 1}. ${item}`)
          .join("\n");
        navigator.clipboard.writeText(text).then(() => {
          const btn = document.getElementById("copy-btn");
          const original = btn.textContent;
          btn.textContent = "Copied!";
          setTimeout(() => (btn.textContent = original), 2000);
        });
      }

      function saveResults() {
        const text =
          "--- Your Ranked List ---\n\n" +
          finalRanking.map((item, i) => `${i + 1}. ${item}`).join("\n");
        const blob = new Blob([text], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "rankings.txt";
        a.click();
        URL.revokeObjectURL(url);
      }

const importBtn = document.getElementById("import-btn");
if (importBtn) importBtn.addEventListener("click", () => {
  const fileInput = document.getElementById("file-input");
  if (fileInput) fileInput.click();
});

const fileInput = document.getElementById("file-input");
if (fileInput) fileInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const text = event.target.result;
    const items = parseItems(text);
    startSorting();
  };
  reader.readAsText(file);
});

document.getElementById("btn-left").addEventListener("click", () => handleChoice(0));
document.getElementById("btn-right").addEventListener("click", () => handleChoice(1));
