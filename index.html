     function showScreen(screenId) {

  screens.forEach((id) => {
    const screen = document.getElementById(`${id}-screen`);
    if (screen) {

        screen.style.display = "block";
      } else {
        screen.classList.remove("active");
        screen.style.display = "none";
      }
    }
  });
}

function startSorting() {

  const items = parseItems(""); 
  logic = new MergeSortLogic(items);
  battleCount = 0;
  showScreen("sort");
  refreshSortUI();
}


      function handleChoice(choice) {
        if (choice === "undo") {
          if (logic.undo()) {
            battleCount = Math.max(0, battleCount - 1);
            refreshSortUI();
          }
          return;
        }

        logic.recordChoice(choice);
        battleCount++;
        refreshSortUI();
      }

      function refreshSortUI() {
        const pair = logic.getNextPair();

        if (!pair) {
          finalRanking = logic.getFinalRanking();
          showResults(finalRanking);
          return;
        }

          const [left, right] = pair;
  btnLeft.innerHTML = getTikTokHTML(left);
  btnRight.innerHTML = getTikTokHTML(right);

        


        battleLabel.textContent = `Battle #${battleCount + 1}`;
        const progress = logic.getProgress();
        progressText.textContent = `${Math.round(progress)}% sorted`;
        progressFill.style.width = `${progress}%`;
        btnUndo.disabled = !logic.canUndo();
      }

    class MergeSortLogic {
  constructor(items) {
    this.totalItems = items.length;
    this.queue = items.map((item) => [item]);
    this.leftSet = [];
    this.rightSet = [];
    this.merged = [];
    this.i = 0;
    this.j = 0;

    this.totalMergesNeeded = items.length - 1;
    this.mergesCompleted = 0;
    this.history = [];
  }

  saveState() {
    this.history.push({
      queue: this.queue.map((g) => [...g]),
      leftSet: [...this.leftSet],
      rightSet: [...this.rightSet],
      merged: [...this.merged],
      i: this.i,
      j: this.j,
      mergesCompleted: this.mergesCompleted,
    });
  }

  canUndo() {
    return this.history.length > 0;
  }

  undo() {
    if (!this.canUndo()) return false;

    const state = this.history.pop();
    this.queue = state.queue;
    this.leftSet = state.leftSet;
    this.rightSet = state.rightSet;
    this.merged = state.merged;
    this.i = state.i;
    this.j = state.j;
    this.mergesCompleted = state.mergesCompleted;
    return true;
  }

  getProgress() {
    if (this.totalMergesNeeded === 0) return 100;

    let base = (this.mergesCompleted / this.totalMergesNeeded) * 100;

    if (this.leftSet.length && this.rightSet.length) {
      const currentTotal = this.leftSet.length + this.rightSet.length;
      const currentDone = this.i + this.j;
      const partial = (currentDone / currentTotal / this.totalMergesNeeded) * 100;
      base += partial;
    }

    return Math.min(99, base);
  }

  recordChoice(choice) {
    this.saveState();

    if (choice === "equal") {
      this.merged.push(this.leftSet[this.i]);
      this.merged.push(this.rightSet[this.j]);
      this.i++;
      this.j++;
    } else if (choice === 0) {
      this.merged.push(this.leftSet[this.i]);
      this.i++;
    } else {
      this.merged.push(this.rightSet[this.j]);
      this.j++;
    }

    if (this.i >= this.leftSet.length) {
      this.merged.push(...this.rightSet.slice(this.j));
      this.finalizeMergeStep();
    } else if (this.j >= this.rightSet.length) {
      this.merged.push(...this.leftSet.slice(this.i));
      this.finalizeMergeStep();
    }
  }

  getNextPair() {
    if (!this.leftSet.length && !this.rightSet.length) {
      if (this.queue.length <= 1) return null;
      this.leftSet = this.queue.shift();
      this.rightSet = this.queue.shift();
      this.merged = [];
      this.i = 0;
      this.j = 0;
    }
    return [this.leftSet[this.i], this.rightSet[this.j]];
  }

  finalizeMergeStep() {
    this.queue.push(this.merged);
    this.leftSet = [];
    this.rightSet = [];
    this.mergesCompleted++;
  }

  getFinalRanking() {
    return this.queue[0] ?? [];
  }
}

      function showResults(ranking) {
         resultsList.innerHTML = ranking
    .map(
      (item, i) =>
        `<li><span class="rank">${i + 1}.</span> ${getTikTokHTML(item)}</li>`
    )
    .join("");

        showScreen("results");
      }

     function escapeHtml(text) {
  return text;
}

      function copyResults() {
        const text = finalRanking
          .map((item, i) => `${i + 1}. ${item}`)
          .join("\n");
        navigator.clipboard.writeText(text).then(() => {
          const btn = document.getElementById("copy-btn");
          const original = btn.textContent;
          btn.textContent = "Copied!";
          setTimeout(() => (btn.textContent = original), 2000);
        });
      }

      function saveResults() {
        const text =
          "--- Your Ranked List ---\n\n" +
          finalRanking.map((item, i) => `${i + 1}. ${item}`).join("\n");
        const blob = new Blob([text], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "rankings.txt";
        a.click();
        URL.revokeObjectURL(url);
      }

const fileInput = document.getElementById("file-input");
if (fileInput) fileInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const text = event.target.result;
    const items = parseItems(text);
    startSorting();
  };
  reader.readAsText(file);
});
