      iframe.remove();

  });
}

/* =========================================
   5. АЛГОРИТМ СОРТИРОВКИ
   ========================================= */

class MergeSortLogic {
  constructor(items) {
    this.totalItems = items.length;
    this.queue = items.map(item => [item]);
    this.leftSet = [];
    this.rightSet = [];
    this.merged = [];
    this.i = 0;
    this.j = 0;
    this.totalMergesNeeded = Math.max(0, items.length - 1);
    this.mergesCompleted = 0;
    this.history = [];
  }

  saveState() {
    this.history.push({
      queue: this.queue.map(group => [...group]),
      leftSet: [...this.leftSet],
      rightSet: [...this.rightSet],
      merged: [...this.merged],
      i: this.i,
      j: this.j,
      mergesCompleted: this.mergesCompleted
    });
  }

  canUndo() {
    return this.history.length > 0;
  }

  undo() {
    if (!this.canUndo()) return false;

    const state = this.history.pop();

    this.queue = state.queue;
    this.leftSet = state.leftSet;
    this.rightSet = state.rightSet;
    this.merged = state.merged;
    this.i = state.i;
    this.j = state.j;
    this.mergesCompleted = state.mergesCompleted;

    return true;
  }

  getProgress() {
    if (this.totalMergesNeeded === 0) return 100;

    let completed = this.mergesCompleted;

    if (this.leftSet.length && this.rightSet.length) {
      const total = this.leftSet.length + this.rightSet.length;
      const compared = this.i + this.j;

      completed += total ? compared / total : 0;
    }

    return Math.min(
      99,
      Math.max(0, completed / this.totalMergesNeeded * 100)
    );
  }

  recordChoice(choice) {
    if (!this.leftSet.length || !this.rightSet.length) return;

    if (this.i >= this.leftSet.length ||
        this.j >= this.rightSet.length) return;

    this.saveState();

    if (choice === "equal") {
      this.merged.push(this.leftSet[this.i++]);
      this.merged.push(this.rightSet[this.j++]);
    } else if (choice === 0) {
      this.merged.push(this.leftSet[this.i++]);
    } else {
      this.merged.push(this.rightSet[this.j++]);
    }

    if (this.i >= this.leftSet.length) {
      this.merged.push(...this.rightSet.slice(this.j));
      this.finalizeMergeStep();
    } else if (this.j >= this.rightSet.length) {
      this.merged.push(...this.leftSet.slice(this.i));
      this.finalizeMergeStep();
    }
  }

  getNextPair() {
    if (!this.leftSet.length && !this.rightSet.length) {
      if (this.queue.length <= 1) return null;

      this.leftSet = this.queue.shift();
      this.rightSet = this.queue.shift();
      this.merged = [];
      this.i = 0;
      this.j = 0;
    }

    if (
      this.i >= this.leftSet.length ||
      this.j >= this.rightSet.length
    ) {
      return null;
    }

    return [this.leftSet[this.i], this.rightSet[this.j]];
  }

  finalizeMergeStep() {
    this.queue.push(this.merged);
    this.leftSet = [];
    this.rightSet = [];
    this.merged = [];
    this.i = 0;
    this.j = 0;
    this.mergesCompleted++;
  }

  getFinalRanking() {
    return this.queue[0] || [];
  }
}

/* =========================================
   6. СОХРАНЕНИЕ ПРОГРЕССА
   ========================================= */

function saveSortProgress() {
  if (!logic) return;

  const state = {
    version: 2,
    videoCount: tiktoks.length,
    battleCount,
    queue: logic.queue,
    leftSet: logic.leftSet,
    rightSet: logic.rightSet,
    merged: logic.merged,
    i: logic.i,
    j: logic.j,
    mergesCompleted: logic.mergesCompleted,
    history: logic.history
  };

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (error) {
    console.error("Не удалось сохранить прогресс:", error);
  }
}

function isValidIndex(index) {
  return Number.isInteger(index) &&
    index >= 0 &&
    index < tiktoks.length;
}

function isValidGroups(groups) {
  return Array.isArray(groups) &&
    groups.every(group =>
      Array.isArray(group) && group.every(isValidIndex)
    );
}

function isValidHistory(history) {
  return Array.isArray(history) && history.every(state =>
    state &&
    isValidGroups(state.queue) &&
    isValidGroups([state.leftSet, state.rightSet, state.merged]) &&
    Number.isInteger(state.i) && state.i >= 0 &&
    Number.isInteger(state.j) && state.j >= 0 &&
    Number.isInteger(state.mergesCompleted) &&
    state.mergesCompleted >= 0
  );
}

function restoreSortProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;

    const state = JSON.parse(raw);

    const valid =
      state.version === 2 &&
      state.videoCount === tiktoks.length &&
      Number.isInteger(state.battleCount) &&
      state.battleCount >= 0 &&
      isValidGroups(state.queue) &&
      isValidGroups([state.leftSet, state.rightSet, state.merged]) &&
      isValidHistory(state.history) &&
      Number.isInteger(state.i) && state.i >= 0 &&
      Number.isInteger(state.j) && state.j >= 0 &&
      Number.isInteger(state.mergesCompleted) &&
      state.mergesCompleted >= 0;

    if (!valid) {
      localStorage.removeItem(STORAGE_KEY);
      return false;
    }

    const restored = new MergeSortLogic(
      tiktoks.map((_, index) => index)
    );

    restored.queue = state.queue;
    restored.leftSet = state.leftSet;
    restored.rightSet = state.rightSet;
    restored.merged = state.merged;
    restored.i = state.i;
    restored.j = state.j;
    restored.mergesCompleted = state.mergesCompleted;
    restored.history = state.history;

    logic = restored;
    battleCount = state.battleCount;

    return true;
  } catch (error) {
    console.error("Не удалось восстановить прогресс:", error);
    return false;
  }
}

/* =========================================
   7. УПРАВЛЕНИЕ СОРТИРОВКОЙ
   ========================================= */

function startSorting() {
  cleanupVideosMemory();

  logic = new MergeSortLogic(
    tiktoks.map((_, index) => index)
  );

  battleCount = 0;
  finalRanking = [];

  saveSortProgress();
  showScreen("sort");
  refreshSortUI();
}

function handleChoice(choice) {
  if (!logic) return;

  if (choice === "undo") {
    if (logic.undo()) {
      battleCount = Math.max(0, battleCount - 1);
      cleanupVideosMemory();
      saveSortProgress();
      refreshSortUI();
    }
    return;
  }

  logic.recordChoice(choice);
  battleCount++;

  cleanupVideosMemory();
  saveSortProgress();
  refreshSortUI();
}

function refreshSortUI() {
  if (!logic) return;

  const pair = logic.getNextPair();

  if (!pair) {
    cleanupVideosMemory();

    finalRanking = logic
      .getFinalRanking()
      .map(index => tiktoks[index]);

    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (error) {
      console.error("Не удалось очистить прогресс:", error);
    }

    showResults(finalRanking);
    return;
  }

  saveSortProgress();

  const [left, right] = pair;

  btnLeft.innerHTML = getTikTokHTML(left);
  btnRight.innerHTML = getTikTokHTML(right);

  battleLabel.textContent = `Battle #${battleCount + 1}`;

  const progress = logic.getProgress();

  progressText.textContent = `${Math.round(progress)}% sorted`;
  progressFill.style.width = `${progress}%`;

  btnUndo.disabled = !logic.canUndo();
}

/* =========================================
   8. РЕЗУЛЬТАТЫ И ССЫЛКИ
   ========================================= */

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function showResults(ranking) {

    <li class="result-item"
        style="margin-bottom:12px;font-size:16px;text-align:left">
      <span class="rank" style="font-weight:bold;color:#6366f1">
        ${index + 1}.
      </span>
      <div class="result-info" style="display:inline-block;margin-left:8px">
        <span class="result-desc">"${escapeHtml(item.desc)}"</span>
        <a
          href="${escapeHtml(item.tiktokUrl)}"
          target="_blank"
          rel="noopener noreferrer"
          class="tiktok-link-btn"
          style="margin-left:10px;color:#6366f1;text-decoration:none;font-size:13px;font-weight:bold"
        >Смотреть видео ↗</a>
      </div>
    </li>
  `).join("");

  showScreen("results");
}

function packResults(ranking) {
  const indices = ranking.map(item =>
    tiktoks.findIndex(video => video.id === item.id)
  );

  if (indices.some(index => index < 0)) {
    throw new Error("Не удалось подготовить результаты");
  }

  const bytes = new Uint8Array(indices);
  let binary = "";

  for (const byte of bytes) {
    binary += String.fromCharCode(byte);
  }

  return btoa(binary)
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

function unpackResults(value) {
  try {
    let base64 = value.replace(/-/g, "+").replace(/_/g, "/");

    while (base64.length % 4) base64 += "=";

    const binary = atob(base64);
    const result = [];

    for (let i = 0; i < binary.length; i++) {
      const index = binary.charCodeAt(i);

      if (!isValidIndex(index)) return null;
      result.push(tiktoks[index]);
    }

    return result.length ? result : null;
  } catch (error) {
    console.error("Ошибка чтения результатов:", error);
    return null;
  }
}

async function saveResults() {
  const username = document
    .getElementById("username-input")
    .value.trim();

  try {
    const packedData = packResults(finalRanking);

    const shareUrl = new URL(
      window.location.pathname,
      window.location.origin
    );

    if (username) {
      shareUrl.searchParams.set("user", username);
    }

    shareUrl.searchParams.set("r", packedData);

    try {
      await navigator.clipboard.writeText(shareUrl.href);
    } catch (error) {
      window.prompt("Скопируй ссылку на результаты:", shareUrl.href);
      return;
    }

    const button = document.getElementById("save-btn");
    const originalText = button.textContent;

    button.textContent = "Link Copied!";

    setTimeout(() => {
      button.textContent = originalText;
    }, 2000);
  } catch (error) {
    console.error("Не удалось создать ссылку:", error);
    alert("Не удалось создать ссылку на результаты.");
  }
}

/* =========================================
   9. КНОПКИ
   ========================================= */

btnLeft.addEventListener("click", () => handleChoice(0));
btnRight.addEventListener("click", () => handleChoice(1));
btnEqual.addEventListener("click", () => handleChoice("equal"));
btnUndo.addEventListener("click", () => handleChoice("undo"));

document.getElementById("save-btn").addEventListener("click", saveResults);

document.getElementById("restart-btn").addEventListener("click", () => {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (error) {
    console.error("Не удалось очистить прогресс:", error);
  }

  window.location.href =
    window.location.origin + window.location.pathname;
});

/* =========================================
   10. ЗАПУСК И ВОССТАНОВЛЕНИЕ
   ========================================= */

function initializeApp() {
  const params = new URLSearchParams(window.location.search);
  const resultData = params.get("r") || params.get("result");
  const userData = params.get("user");

  const usernameContainer =
    document.getElementById("username-container");

  const restartBtn =
    document.getElementById("restart-btn");

  if (resultData) {
    const ranking = unpackResults(resultData);

    if (ranking) {
      finalRanking = ranking;
      showResults(finalRanking);

      if (userData) {
        document.getElementById("results-title").textContent =
          `${userData}'s results`;

        restartBtn.textContent = "Try it yourself";
        usernameContainer.style.display = "none";
      }

      return;
    }
  }

  usernameContainer.style.display = "flex";
  restartBtn.textContent = "Start over";

  if (restoreSortProgress()) {
    showScreen("sort");
    refreshSortUI();
  } else {
    startSorting();
  }
}

initializeApp();

/* Дополнительное сохранение при уходе со страницы */
window.addEventListener("pagehide", saveSortProgress);
</script>
